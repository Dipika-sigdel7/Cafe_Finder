<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restore Password</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

  <link rel="stylesheet" href="{{ url_for('static', filename='admin_restore_password.css') }}">

</head>
<body>

<div class="modal">
  <div class="modal-content">
    <h2>Restore Password</h2>
    <form id="restore-form" method="POST">
      <input type="email" name="email" placeholder="Enter your email" required />
      <button type="submit">Send Reset Link</button>
    </form>

    {% if message %}
      <p class="message-success">{{ message }}</p>
    {% endif %}
    {% if error %}
      <p class="message-error">{{ error }}</p>
    {% endif %}

    <a href="{{ url_for('admin_login') }}" class="forget-password">Back to Login</a>
  </div>
</div>

<script>
  const form = document.getElementById("restore-form");
  form.addEventListener("submit", function(e) {
    // Optional: show alert before submitting
    alert("Reset code has been sent to your email!");
    // Form will submit normally to Flask backend
  });
</script>

</body>
</html>
