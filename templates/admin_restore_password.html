<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restore Password</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    /* Center modal */
    body {
      margin: 0;
      font-family: 'Merienda One', cursive;
      background: linear-gradient(to bottom, #f4ede6, #fdf6f0);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .modal {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
    }

    .modal-content {
      background: #fff8f0;
      padding: 40px 30px;
      border-radius: 12px;
      box-shadow: 0 12px 25px rgba(0,0,0,0.15);
      text-align: center;
      width: 350px;
      max-width: 90%;
    }

    .modal-content h2 {
      margin-bottom: 25px;
      color: #5a3e36;
      font-size: 28px;
    }

    .modal-content input[type="email"] {
      width: 100%;
      padding: 12px;
      margin-bottom: 18px;
      border: 1px solid #c59d5f;
      border-radius: 8px;
      font-size: 16px;
    }

    .modal-content button {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 10px;
      border: none;
      background-color: #c59d5f;
      color: white;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .modal-content button:hover {
      background-color: #a67c3d;
    }

    .modal-content .forget-password {
      display: block;
      margin-top: 12px;
      font-size: 14px;
      color: #5a3e36;
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .modal-content .forget-password:hover {
      color: #c59d5f;
      text-decoration: underline;
    }

    /* Message styles */
    .message-success {
      color: green;
      font-weight: bold;
      text-align: center;
      margin-bottom: 15px;
    }

    .message-error {
      color: red;
      font-weight: bold;
      text-align: center;
      margin-bottom: 15px;
    }

  </style>
</head>
<body>

<div class="modal">
  <div class="modal-content">
    <h2>Restore Password</h2>
    <form id="restore-form" method="POST">
      <input type="email" name="email" placeholder="Enter your email" required />
      <button type="submit">Send Reset Link</button>
    </form>

    {% if message %}
      <p class="message-success">{{ message }}</p>
    {% endif %}
    {% if error %}
      <p class="message-error">{{ error }}</p>
    {% endif %}

    <a href="{{ url_for('admin_login') }}" class="forget-password">Back to Login</a>
  </div>
</div>

<script>
  const form = document.getElementById("restore-form");
  form.addEventListener("submit", function(e) {
    // Optional: show alert before submitting
    alert("Reset code has been sent to your email!");
    // Form will submit normally to Flask backend
  });
</script>

</body>
</html>
