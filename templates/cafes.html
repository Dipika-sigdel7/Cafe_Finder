<!doctype html>
<html>
  <head>
    <title>Cafes|Cafe Finder</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='cafes.css') }}"
    >
  </head>
  <body>
    <!-- =====================================================
         CAFES PAGE
    ====================================================== -->

    <section class="cafes-page">
      <!-- Page Heading -->

      <div class="cafes-heading">
        <span class="coffee-icon">☕</span>

        <h1>Explore Cafes</h1>

        <p>Choose a cafe to explore its details, menu and services.</p>
      </div>

      <!-- =================================================
             ALL CAFES FROM DATABASE
        ================================================== -->

      <div class="cafes-list">
        {% for cafe in cafes %}

        <a
          href="{{ url_for('cafe_details', cafe_id=cafe.id) }}"
          class="cafe-name-card"
        >
          <div class="cafe-name-icon">☕</div>

          <div class="cafe-name-content">
            <h2>{{ cafe.name }}</h2>

            {% if cafe.location %}
            <p>📍 {{ cafe.location }}</p>
            {% endif %}
          </div>

          <div class="cafe-arrow">→</div>
        </a>

        {% else %}

        <!-- No cafes -->

        <div class="no-cafes">
          <div class="no-cafe-icon">☕</div>

          <h2>No Cafes Available</h2>

          <p>No cafes have been added yet.</p>
        </div>

        {% endfor %}
      </div>
    </section>
  </body>
</html>
