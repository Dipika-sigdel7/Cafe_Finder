<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafe Finder</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Merienda+One:wght@300;400;700&display=swap');
*{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial,  sans-serif;
    }

    /* cafe Section */
    .cafe{
      height:100vh;
      background: url("https://static.vecteezy.com/system/resources/previews/046/110/096/non_2x/two-hands-holding-two-cups-of-coffee-with-hearts-free-photo.jpeg") no-repeat center/cover;
      display:flex;
      justify-content:center;
      align-items:center;
      text-align:center;
      color:white;
      position:relative;
    }

    /* dhamilooo banako*/
    .cafe::before{
      content:"";
      position:absolute;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background:rgba(0,0,0,0.5);
    }

    .cafe-content{
      position:relative;
      max-width:600px;
    }
</style>
<body>

<section class="cafe">
    <div class="cafe-content">
        <h1>Your Perfect Cafe Spot Awaits</h1>

        <p>
            Discover the best cafes around you.<br>
            Find cozy corners, delicious drinks, and peaceful vibes — all in one place.
        </p>

      <a href="{{ url_for('home') }}" class="btn">
    Explore Now
</a>
    </div>
</section>

</body>
</html>
