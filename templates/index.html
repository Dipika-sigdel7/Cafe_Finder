<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>nextpage</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"/>
  </head>
  <body>
    <header>
      <ul class="nav-links">
        <li><a href="{{ url_for('home') }}">Home</a></li>
        <li><a href="{{ url_for('cafes') }}">Cafes</a></li> 
        <li><a href="#">About</a></li>
        <li><a href="#">Contact</a></li>
        <li><a href="{{ url_for('admin_login') }}">Admin</a></li>
      </ul>
    </header>

    <div id="main-content">
      <section class="coffee-section">
        <div class="coffee-left">
          <h1>Welcome to Cafe Finder</h1>
        </div>

        <div class="coffee-center">
          <img
            src="https://thumbs.dreamstime.com/b/cup-coffee-white-background-takeaway-cup-coffee-white-background-falling-coffee-beans-white-background-151775196.jpg"
            alt="Coffee Cup"
          />
        </div>

        <div class="coffee-right">
          <p>
            Here you can explore all the amazing cafes and enjoy your perfect
            cup
          </p>
        </div>
      </section>

        <!-- Search Section -->
  <section class="search-section" style="text-align:center; margin:50px 0;">
    <h2 style="font-size:28px; color:#5d4037; margin-bottom:20px;">Search for a Cafe</h2>
    <input type="text" id="searchInput" placeholder="Enter Cafe Name" style="padding:10px 15px; border-radius:5px; border:1px solid #ccc; width:250px; max-width:80%;">
    <button class="search-btn" id="searchBtn" style="padding:10px 20px; border:none; border-radius:5px; background:#c59d5f; color:white; font-weight:bold; cursor:pointer;">Search</button>
  </section>

      <!-- Our Recommendation Section -->
<section class="recommendation-section">

    <h2 class="section-title">Our Recommendation</h2>

    <ul class="recommendation-list">

        {% for cafe in cafes[:5] %}

        <li>
    <a 
    href="{{ url_for('cafe_details', cafe_id=cafe.id) }}"
    class="recommendation-link">

        {{ cafe.name }}

    </a>
</li>
        {% endfor %}

    </ul>

</section>



<!-- For search button -->
    <script>
document.getElementById("searchBtn").addEventListener("click", function() {
    const query = document.getElementById("searchInput").value.trim();

    if (query === "") {
        alert("Please enter a cafe name!");
        return;
    }

    // Fetch from backend
    fetch(`/search_cafe?name=${encodeURIComponent(query)}`)
        .then(response => response.json())
        .then(data => {
            if (data.found) {
                // Redirect to cafe details page
                window.location.href = `/cafe/${data.cafe_id}`;
            } else {
                alert("Cafe not found!");
            }
        })
        .catch(error => { 
        console.error("Error:", error);
                    alert("Something went wrong. Please try again.");
        });
});



</script>
  </body>
</html>
