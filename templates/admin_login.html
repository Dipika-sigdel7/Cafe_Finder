<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LOGIN</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}" />

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='admin_login.css') }}" />

    
  </head>

<body>

  <!-- =========================================
       SUCCESS POPUP
       ========================================= -->

  {% with messages = get_flashed_messages(with_categories=true) %}

    {% for category, message in messages %}

      {% if category == "success" %}

        <div
          class="success-popup"
          id="success-popup"
        >

          <span class="success-icon">
            ✓
          </span>

          <span class="success-message">
            {{ message }}
          </span>

          <button
            type="button"
            class="popup-close"
            onclick="closeSuccessPopup()"
          >
            &times;
          </button>

        </div>

      {% endif %}

    {% endfor %}

  {% endwith %}


  <!-- =========================================
       LOGIN MODAL
       ========================================= -->

  <div class="modal">

    <div class="modal-content">

      <!-- Close button -->

      <span
        class="close-btn"
        onclick="goHome()"
      >
        &times;
      </span>


      <h2>Login</h2>


      <!-- =========================================
           ERROR MESSAGE
           ========================================= -->

      {% if error %}

        <div class="message-error">
          {{ error }}
        </div>

      {% endif %}


      <!-- =========================================
           LOGIN FORM
           ========================================= -->

      <form
        method="POST"
        action="{{ url_for('admin_login') }}"
        id="login-form"
      >

        <!-- Username or Email -->

        <input
          type="text"
          name="login"
          placeholder="Username or Email"
          autocomplete="username"
          required
        >


        <!-- Password -->

        <input
          type="password"
          name="password"
          placeholder="Password"
          autocomplete="current-password"
          required
        >


        <!-- Login button -->

        <button type="submit">
          Login
        </button>


        <!-- Forgot password -->

        <a
          href="{{ url_for('admin_restore_password') }}"
          class="forget-password"
        >
          Forgot Password?
        </a>

      </form>


      <!-- =========================================
           CREATE ACCOUNT
           ========================================= -->

      <p class="create-account">

        Don't have an account?

        <a href="{{ url_for('register') }}">
          Create Account
        </a>

      </p>

    </div>

  </div>


  <!-- =========================================
       JAVASCRIPT
       ========================================= -->

  <script>

    function goHome() {

      window.location.href =
        "{{ url_for('home') }}";

    }


    function closeSuccessPopup() {

      const popup =
        document.getElementById("success-popup");

      if (popup) {
        popup.remove();
      }

    }


    // Automatically close popup after 5 seconds

    setTimeout(function () {

      closeSuccessPopup();

    }, 5000);

  </script>


</body>

</html>
