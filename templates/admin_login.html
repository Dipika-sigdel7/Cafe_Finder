<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LOGIN</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
     <style>
/* =========================================================
   LOGIN PAGE
   ========================================================= */

.modal {
    width: 100%;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 30px 20px;
    box-sizing: border-box;

    background: transparent;
}


/* =========================================================
   LOGIN CARD
   ========================================================= */

.modal-content {
    position: relative;

    width: 440px;
    max-width: 100%;

    padding: 42px 45px 38px;

    background: #fff8f0;

    border: 1px solid rgba(197, 157, 95, 0.25);
    border-radius: 20px;

    box-shadow:
        0 20px 45px rgba(90, 62, 54, 0.15),
        0 5px 15px rgba(90, 62, 54, 0.08);

    text-align: center;

    box-sizing: border-box;

    animation: loginCard 0.45s ease;
}


/* =========================================================
   CARD ANIMATION
   ========================================================= */

@keyframes loginCard {
    from {
        opacity: 0;
        transform: translateY(15px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}


/* =========================================================
   CLOSE BUTTON
   ========================================================= */

.close-btn {
    position: absolute;

    top: 16px;
    right: 20px;

    width: 32px;
    height: 32px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    color: #5a3e36;

    font-size: 23px;
    font-weight: bold;

    cursor: pointer;

    transition:
        background-color 0.25s ease,
        color 0.25s ease,
        transform 0.25s ease;
}

.close-btn:hover {
    background-color: #f1dfc5;
    color: #a67c3d;

    transform: rotate(90deg);
}


/* =========================================================
   LOGIN TITLE
   ========================================================= */

.modal-content h2 {
    margin: 0 0 30px;

    color: #5a3e36;

    font-size: 34px;
    font-weight: 700;

    letter-spacing: 0.5px;
}


/* =========================================================
   LOGIN FORM
   ========================================================= */

#login-form {
    width: 100%;
}


/* =========================================================
   INPUTS
   ========================================================= */

.modal-content input[type="text"],
.modal-content input[type="email"],
.modal-content input[type="password"] {
    width: 100%;

    height: 52px;

    padding: 0 16px;

    margin-bottom: 17px;

    border: 1.5px solid #d2a866;
    border-radius: 10px;

    background: #ffffff;

    color: #4b352e;

    font-family: inherit;
    font-size: 16px;

    outline: none;

    box-sizing: border-box;

    transition:
        border-color 0.25s ease,
        box-shadow 0.25s ease,
        background-color 0.25s ease;
}


/* INPUT HOVER */

.modal-content input:hover {
    border-color: #b98b4c;
}


/* INPUT FOCUS */

.modal-content input:focus {
    border-color: #a67c3d;

    background-color: #fffdf9;

    box-shadow:
        0 0 0 3px rgba(197, 157, 95, 0.15);
}


/* PLACEHOLDER */

.modal-content input::placeholder {
    color: #a79a92;

    opacity: 1;
}


/* =========================================================
   LOGIN BUTTON
   ========================================================= */

.modal-content button {
    width: 100%;

    height: 52px;

    margin-top: 3px;

    border: none;
    border-radius: 10px;

    background: linear-gradient(
        135deg,
        #cda464,
        #b88b4c
    );

    color: #ffffff;

    font-family: inherit;
    font-size: 17px;
    font-weight: 700;

    cursor: pointer;

    box-shadow:
        0 6px 15px rgba(166, 124, 61, 0.22);

    transition:
        transform 0.25s ease,
        box-shadow 0.25s ease,
        background 0.25s ease;
}


/* BUTTON HOVER */

.modal-content button:hover {
    background: linear-gradient(
        135deg,
        #b88b4c,
        #a67c3d
    );

    transform: translateY(-2px);

    box-shadow:
        0 9px 20px rgba(166, 124, 61, 0.28);
}


/* BUTTON CLICK */

.modal-content button:active {
    transform: translateY(0);
}


/* =========================================================
   FORGOT PASSWORD
   ========================================================= */

.forget-password {
    display: inline-block;

    margin-top: 16px;

    color: #6b4a3f;

    font-size: 14px;
    font-weight: 600;

    text-decoration: none;

    transition:
        color 0.25s ease,
        transform 0.25s ease;
}

.forget-password:hover {
    color: #b88b4c;

    text-decoration: underline;
}


/* =========================================================
   CREATE ACCOUNT
   ========================================================= */

.create-account {
    margin: 25px 0 0;

    color: #6b4a3f;

    font-size: 14px;

    line-height: 1.6;
}

.create-account a {
    display: inline-block;

    margin-left: 4px;

    color: #b88b4c;

    font-weight: 700;

    text-decoration: none;

    transition:
        color 0.25s ease,
        transform 0.25s ease;
}

.create-account a:hover {
    color: #8f6738;

    text-decoration: underline;
}


/* =========================================================
   ERROR MESSAGE
   ========================================================= */

.message-error {
    margin: 0 0 18px;

    padding: 10px 14px;

    border-radius: 8px;

    background: #fff0ee;

    border: 1px solid #e2aaa3;

    color: #b43d32;

    font-size: 14px;
    font-weight: 600;

    line-height: 1.4;
}


/* =========================================================
   SUCCESS MESSAGE
   ========================================================= */

.message-success {
    margin: 0 0 18px;

    padding: 10px 14px;

    border-radius: 8px;

    background: #eef9ef;

    border: 1px solid #a8d5ac;

    color: #34783a;

    font-size: 14px;
    font-weight: 600;
}


/* =========================================================
   TABLET
   ========================================================= */

@media (max-width: 768px) {

    .modal {
        min-height: 100vh;

        padding: 25px 18px;
    }

    .modal-content {
        width: 400px;

        padding: 38px 32px 34px;
    }

    .modal-content h2 {
        font-size: 30px;

        margin-bottom: 26px;
    }
}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 480px) {

    .modal {
        padding: 20px 15px;
    }

    .modal-content {
        width: 100%;

        padding: 34px 24px 30px;

        border-radius: 16px;
    }

    .modal-content h2 {
        font-size: 28px;

        margin-bottom: 24px;
    }

    .modal-content input[type="text"],
    .modal-content input[type="email"],
    .modal-content input[type="password"] {
        height: 50px;

        padding: 0 14px;

        font-size: 15px;
    }

    .modal-content button {
        height: 50px;

        font-size: 16px;
    }

    .create-account {
        font-size: 13px;
    }

    .close-btn {
        top: 13px;
        right: 15px;
    }
}


/* =========================================================
   VERY SMALL PHONES
   ========================================================= */

@media (max-width: 320px) {

    .modal-content {
        padding: 30px 18px 26px;
    }

    .modal-content h2 {
        font-size: 25px;
    }

    .modal-content input[type="text"],
    .modal-content input[type="email"],
    .modal-content input[type="password"] {
        height: 47px;

        font-size: 14px;
    }

    .modal-content button {
        height: 47px;

        font-size: 15px;
    }
}
</style>
          </head>

          <body>
            <div class="modal">
              <div class="modal-content">
                <!-- Close button -->
                <span class="close-btn" onclick="goHome()">&times;</span>

                <h2>Login</h2>

                <form
                  method="POST"
                  action="{{ url_for('admin_login') }}"
                  id="login-form"
                >
                  <input
                    type="text"
                    name="login"
                    placeholder="Username or Email"
                    required
                  />

                  <input
                    type="password"
                    name="password"
                    placeholder="Password"
                    required
                  />

                  <button type="submit">Login</button>

                  <a
                    href="{{ url_for('admin_restore_password') }}"
                    class="forget-password"
                  >
                    Forgot Password?
                  </a>
                </form>

                <p class="create-account">
                  Don't have an account?
                  <a href="{{ url_for('register') }}"> Create Account </a>
                </p>

                {% if error %}
                <p class="message-error">{{ error }}</p>
                {% endif %}
              </div>
            </div>

            <script>
              function goHome() {
                // Redirect to home page
                window.location.href = "{{ url_for('home') }}";
              }
            </script>
          </body>
        </html>
      </div>
    </div>

    <script>
      function goHome() {
        // Redirect to home page
        window.location.href = "{{ url_for('home') }}";
      }
    </script>
  </body>
</html>
