<!DOCTYPE html>
<html>

<head>

<title>Edit Cafe</title>

<style>

body{
    margin:0;
    padding:0;
    font-family:"Poppins", sans-serif;
    background:#f8f5f2;
    color:#333;
}


/* Header */

.header{

    background:#3e2723;
    color:white;
    text-align:center;
    padding:25px;

}

.header h1{

    margin:0;
    font-size:36px;
    letter-spacing:1px;

}



/* Main container */

.container{

    width:80%;
    max-width:900px;
    margin:40px auto;
    background:white;
    padding:40px;

    border-radius:15px;

    box-shadow:
    0 5px 20px rgba(0,0,0,0.15);

}



/* Form */

form{

    display:flex;
    flex-direction:column;
    gap:15px;

}


label{

    font-size:17px;
    font-weight:bold;
    color:#5d4037;

}



input,
textarea{

    padding:12px;

    border:1px solid #ccc;

    border-radius:8px;

    font-size:16px;

    outline:none;

}



input:focus,
textarea:focus{

    border-color:#8d6e63;

}



textarea{

    height:130px;
    resize:none;

}



/* Images section */

h2{

    color:#5d4037;
    margin-top:30px;

}



.image-container{

    display:flex;
    flex-wrap:wrap;
    gap:20px;

}



.image-box{

    background:#fff3e0;

    padding:15px;

    border-radius:12px;

    text-align:center;

    box-shadow:0 3px 10px rgba(0,0,0,0.1);

}



.image-box img{

    width:160px;
    height:110px;

    object-fit:cover;

    border-radius:10px;

}



.remove{

    margin-top:10px;

    color:#c62828;

    font-weight:bold;

}



/* File upload */

input[type="file"]{

    background:#fff3e0;

    cursor:pointer;

}



/* Button */

button{

    margin-top:25px;

    padding:14px;

    border:none;

    border-radius:10px;

    background:#3e2723;

    color:white;

    font-size:18px;

    cursor:pointer;

    transition:0.3s;

}



button:hover{

    background:#5d4037;

    transform:translateY(-2px);

}



/* Responsive */

@media(max-width:700px){

    .container{

        width:90%;
        padding:20px;

    }


    .image-box img{

        width:130px;
        height:90px;

    }

}

</style>

</head>


<body>


<div class="header">

<h1>Edit Cafe Details</h1>

</div>



<div class="container">


<form method="POST" enctype="multipart/form-data">



<label>Name</label>

<input 
type="text"
name="name"
value="{{ cafe.name }}"
>



<label>Description</label>

<textarea name="description">{{ cafe.description }}</textarea>



<label>Location</label>

<input 
type="text"
name="location"
value="{{ cafe.location }}"
>



<label>Open Time</label>

<input 
type="text"
name="open_time"
value="{{ cafe.open_time }}"
>



<label>Close Time</label>

<input 
type="text"
name="close_time"
value="{{ cafe.close_time }}"
>

<label>Latitude</label>
<input 
type="text"
name="latitude"
value="{{ cafe.latitude }}">


<label>Longitude</label>
<input 
type="text"
name="longitude"
value="{{ cafe.longitude }}">



<h2>Existing Images</h2>


<div class="image-container">


{% for image in images %}

<div class="image-box">


<img 
src="{{ url_for('static', filename=image.image_path) }}"
>


<div class="remove">

<input 
type="checkbox"
name="delete_images"
value="{{ image.id }}"
>

Remove

</div>


</div>


{% endfor %}


</div>





<h2>Add New Images</h2>


<input 
type="file"
name="new_images"
multiple
accept="image/*"
>



<button type="submit">

Update Cafe

</button>


</form>


</div>


</body>

</html>
