<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<!-- Leaflet  CSS-->
<link 
rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<script 
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>
<style>
body.admin-dashboard {
    font-family: 'Merienda One', cursive;
    background: #f4f1ee;
    margin: 0;
    padding: 0;
}

/* Header */
.admin-header {
    background-color: transparent;
    padding: 10px 20px;
    text-align: left;
}

.admin-header h1 {
    margin: 0;
    font-size: 24px;
    font-weight: bold;             /* bold text */
    text-decoration: underline;    /* underline text */
    color: #5a3e36;                /* same as admin login page */
}

/* Dashboard container - split into two columns */
.dashboard-container {
    display: flex;
    gap: 30px;
    max-width: 1200px;
    margin: 30px auto;
    padding: 0 20px;
    align-items: flex-start;
}

/* Left column - Add Cafe */
.add-cafe {
   flex: 1;
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}

/* Make Both Sides equal width */
.add-cafe,
.manage-menu {

    width:50%;

}

/* Right column - Manage Menu */
.manage-menu {
   flex: 1;
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}


/* Form inputs */
.cafe-form input,
.cafe-form textarea,
.cafe-form select {

    width:100%;
    padding:10px;
    margin:8px 0 15px;
    border-radius:6px;
    border:1px solid #ccc;

}


/* Logout button at bottom-right */
.logout-btn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: #c59d5f;
    color: white;
    padding: 12px 20px;
    border-radius: 6px;
    text-decoration: none;
    font-weight: bold;
    transition: 0.3s;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
}

.logout-btn:hover {
    background: #a67c3d;
}


/* Manage Existing Cafe */
.cafe-box{
    background:#f7f3ef;
    padding:20px;
    margin-bottom:20px;
    border-radius:12px;
    display:flex;
    flex-direction:column;
    gap:12px;
}

/* Buttons */
.action-btn {
    display:block;
    text-align:center;
    margin-top:10px;
    padding:10px;
    background:#c59d5f;
    color:white;
    text-decoration:none;
    border-radius:6px;
}

.action-btn:hover {
    background:#a67c3d;
}

/*delete button*/
.delete-btn {
    background:red;
}

/* For menu rows */
.menu-row {
    display:flex;
    gap:10px;
    margin-bottom:15px;
}

.menu-row input,
.menu-row select {
   flex:1;
}

#adminMap{

    height:400px;

    width:100%;

    margin-top:15px;

    border-radius:10px;

}

/* Responsive */
@media(max-width:900px){

    .dashboard-container {
        flex-direction: column;
    }

    .add-cafe,
    .manage-menu {
        width:100%;
        min-width: unset;
    }

}
</style>
</head>

<body class="admin-dashboard">

<header class="admin-header">
    <h1>Admin Dashboard</h1>
</header>

<div class="dashboard-container">

    <!-- Left side: Add new cafe -->
    <div class="add-cafe">
        <h2>Add New Cafe</h2>
        <form class="cafe-form" method="POST" action="{{ url_for('admin_dashboard') }}" enctype="multipart/form-data">
            <label>Name</label>
            <input type="text" name="name" required>

            <label>Description</label>
            <textarea name="description"></textarea>

            <label>Location</label>
            <input type="text" name="location">

            <label>Open Time</label>
            <input type="time" name="open_time" required>

            <label>Close Time</label>
            <input type="time" name="close_time" required>

            <label>Select Cafe Location</label>
            <div id="adminMap"></div>

            <input 
            type="hidden" name="latitude" id="latitude">

            <input 
            type="hidden" name="longitude" id="longitude">

            <label>Upload Cafe Images</label>
            <input 
            type="file" name="images" id="images" multiple accept="image/*">

<!-- For Menu -->
<h4>Menu Items</h4>

<div id="menu-items">

    <div class="menu-row">

        <input type="text" 
               name="item_name[]" 
               placeholder="Item Name">


        <select name="item_category[]">
            <option value="Food">🍛 Food</option>
            <option value="Drinks">☕ Drinks</option>
            <option value="Desserts">🍰 Desserts</option>
            <option value="Snacks">🍟 Snacks</option>
        </select>


        <input type="number" 
               name="item_price[]" 
               placeholder="Price">

    </div>

</div>


<button type="button" onclick="addMenuItem()">
    Add More Menu Item
</button>
<!-- Add Cafe Button -->
<button type="submit" class="add-cafe-btn">
    Add Cafe
</button>
</form>
</div>

    <!-- Right side: Manage menu items -->
    <div class="manage-menu">
    <h2>Manage Existing Cafe</h2>
    {% for cafe in cafes %}
    <div class="cafe-box">

    <h3>{{ cafe.name }}</h3>

    <a href="{{ url_for('manage_menu', cafe_id=cafe.id) }}" class="action-btn">
    Menu Items
    </a>

    <a href="{{ url_for('edit_cafe', cafe_id=cafe.id) }}" class="action-btn">
    Edit Cafe Details
    </a>

        <a href="{{ url_for('delete_cafe', cafe_id=cafe.id) }}"
       class="action-btn delete-btn"
       onclick="return confirm('Are you sure you want to remove this cafe?')">
        Remove Cafe
    </a>
</div>
{% endfor %}
</div>

<!-- Logout button -->
<a href="{{ url_for('admin_logout') }}" class="logout-btn">Logout</a>

<script>

function toggleMenu(id){

    let menu = document.getElementById("menu-" + id);

    if(menu.style.display === "block"){
        menu.style.display = "none";
    }
    else{
        menu.style.display = "block";
    }

}

</script>

<script>
function addMenuItem() {

    const container = document.getElementById("menu-items");

    container.insertAdjacentHTML('beforeend', `

        <div class="menu-row">

            <input type="text" 
                   name="item_name[]" 
                   placeholder="Item Name">


            <select name="item_category[]">

                <option value="Food">🍛 Food</option>

                <option value="Drinks">☕ Drinks</option>

                <option value="Desserts">🍰 Desserts</option>

                <option value="Snacks">🍟 Snacks</option>

            </select>


            <input type="number" 
                   step="0.01"
                   name="item_price[]" 
                   placeholder="Price">

        </div>

    `);

}
</script>

<!-- Leaflet JS should be before your map script -->
<script 
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<!-- For Location Picker -->
<script>

let adminMap;
let marker;

function loadAdminMap(){

    // Prevent duplicate initialization
    if(adminMap){
        adminMap.invalidateSize();
        return;
    }

    adminMap=L.map('adminMap')
    .setView(
    [26.6638,87.2718],
    13
    );


L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
    attribution:'© OpenStreetMap'
}
).addTo(adminMap);

adminMap.on('click',function(e){
    let lat=e.latlng.lat;
    let lng=e.latlng.lng;

// store values in hidden inputs
    document.getElementById("latitude").value=lat;
    document.getElementById("longitude").value=lng;

    // Update Maker
    if(marker){

        marker.setLatLng(e.latlng);

    }
    else{

        marker=L.marker(e.latlng)
        .addTo(adminMap);

    }
      // Get place details from OpenStreetMap
    fetch(
        `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`
    )
    .then(response => response.json())
    .then(data => {


        let address = data.display_name || "Address not found";


        // Automatically fill location input
        document.querySelector('input[name="location"]').value = address;

          
                marker.bindPopup(`
            <div style="width:250px">

                <h3>📍 Selected Place</h3>

                <p>
                    ${address}
                </p>

                <hr>

                <b>Latitude:</b>
                ${lat.toFixed(6)}

                <br>

                <b>Longitude:</b>
                ${lng.toFixed(6)}

            </div>
        `)
        .openPopup();


        console.log("Place:", address);
        console.log("Latitude:", lat);
        console.log("Longitude:", lng);


    })
    .catch(error => {

        console.log(error);

        marker.bindPopup(
            "Location details unavailable"
        )
        .openPopup();

    });


});
}
// Call map function
window.onload = loadAdminMap;

</script>

</body>
</html>
