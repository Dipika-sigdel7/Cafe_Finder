<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<style>
body.admin-dashboard {
    font-family: 'Merienda One', cursive;
    background: #f4f1ee;
    margin: 0;
    padding: 0;
}

/* Header */
.admin-header {
    background-color: transparent;
    padding: 10px 20px;
    text-align: left;
}
.admin-header h1 {
    margin:0;
    font-size:24px;
}
.admin-header h1 {
    margin: 0;
    font-size: 24px;
    font-weight: bold;             /* bold text */
    text-decoration: underline;    /* underline text */
    color: #5a3e36;                /* same as admin login page */
}

/* Dashboard container - split into two columns */
.dashboard-container {
    display: flex;
    gap: 30px;
    max-width: 1200px;
    margin: 30px auto;
    padding: 0 20px;
    flex-wrap: wrap;
}

/* Left column - Add Cafe */
.add-cafe {
    flex: 1;
    min-width: 300px;
}

/* Right column - Manage Menu */
.manage-menu {
    flex: 1;
    min-width: 300px;
}

/* Cafe form styles */
.cafe-form {
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.1);
}

.cafe-form label {
    display: block;
    margin-top: 10px;
    font-weight: bold;
}

.cafe-form input, 
.cafe-form textarea {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    margin-bottom: 10px;
    border-radius: 6px;
    border: 1px solid #ccc;
    font-family: 'Merienda One', cursive;
}

.cafe-form button {
    background: #c59d5f;
    color: white;
    border: none;
    padding: 12px 25px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 16px;
    transition: 0.3s;
    margin-top: 10px;
}

.cafe-form button:hover {
    background: #a67c3d;
}

/* Logout button at bottom-right */
.logout-btn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: #c59d5f;
    color: white;
    padding: 12px 20px;
    border-radius: 6px;
    text-decoration: none;
    font-weight: bold;
    transition: 0.3s;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
}

.logout-btn:hover {
    background: #a67c3d;
}
.menu-list{
    display:none;
    padding-left:20px;
}


.cafe-name{
    cursor:pointer;
    color:#333;
}


.cafe-name:hover{
    color:#c89b4a;
}


.cafe-box{
    margin-bottom:20px;
}

.menu-list {
    display: none;
}

.cafe-name {
    cursor: pointer;
}

/*delete button*/
.delete-btn{
    background:red;
    color:white;
    padding:8px 15px;
    border:none;
    cursor:pointer;
}


/* Responsive */
@media(max-width:900px){
    .dashboard-container {
        flex-direction: column;
    }
}
</style>
</head>
<script>

function toggleMenu(id){

    let menu = document.getElementById("menu-" + id);

    if(menu.style.display === "block"){
        menu.style.display = "none";
    }
    else{
        menu.style.display = "block";
    }

}


</script>

<body class="admin-dashboard">

<header class="admin-header">
    <h1>Admin Dashboard</h1>
</header>

<div class="dashboard-container">

    <!-- Left side: Add new cafe -->
    <div class="add-cafe">
        <h2>Add New Cafe</h2>
        <form class="cafe-form" method="POST" action="{{ url_for('admin_dashboard') }}" enctype="multipart/form-data">
            <label>Name</label>
            <input type="text" name="name" required>

            <label>Description</label>
            <textarea name="description"></textarea>

            <label>Location</label>
            <input type="text" name="location">

            <label>Open Time</label>
            <input type="time" name="open_time" required>

            <label>Close Time</label>
            <input type="time" name="close_time" required>

            <label>Upload Cafe Images</label>

<input 
    type="file" 
    name="images" 
    id="images"
    multiple
    accept="image/*"
>

<!-- Image Preview -->
<div id="image-preview"></div>

            <h4>Menu Items</h4>
            <div id="menu-items">
               <input type="text" name="item_name[]" placeholder="Item Name">

<select name="item_category[]">
    <option value="Food">Food</option>
    <option value="Drinks">Drinks</option>
    <option value="Desserts">Desserts</option>
    <option value="Snacks">Snacks</option>
</select>

<input type="number" name="item_price[]" placeholder="Price">
            </div>
            <button type="button" onclick="addMenuItem()">Add More Menu Item</button><br><br>

            <button type="submit">Add Cafe</button>
        </form>
    </div>

    <!-- Right side: Manage menu items -->
    <div class="manage-menu">
    <h2>Manage Existing Cafe</h2>
    {% for cafe in cafes %}
<div class="cafe-box">

    <h3>{{ cafe.name }}</h3>

  <a href="{{ url_for('manage_menu', cafe_id=cafe.id) }}">
    <button type="button">
        Menu Items
    </button>
</a>

   <a href="{{ url_for('edit_cafe', cafe_id=cafe.id) }}">
    <button type="button">
        Edit Cafe Details
    </button>
</a>


<a href="{{ url_for('delete_cafe', cafe_id=cafe.id) }}"
   onclick="return confirm('Are you sure you want to remove this cafe?')">

    <button type="button" class="delete-btn">
        Remove Cafe
    </button>

</a>

</div>
{% endfor %}

<!-- Logout button -->
<a href="{{ url_for('admin_logout') }}" class="logout-btn">Logout</a>


<!-- menu item javascript -->
<script>
function addMenuItem() {
    const container = document.getElementById("menu-items");
    container.insertAdjacentHTML('beforeend', `
        <input type="text" name="item_name[]" placeholder="Item Name">
        <input type="number" step="0.01" name="item_price[]" placeholder="Price">
    `);
}
</script>
</body>
</html>
